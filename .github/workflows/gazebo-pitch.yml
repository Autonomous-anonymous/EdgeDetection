name: Gazebo pitch rehearsal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/gazebo-pitch.yml'
      - 'edge-path-project/gazebo/scripts/*pitch*.py'
      - 'edge-path-project/gazebo/scripts/*sil*v6*.py'
      - 'edge-path-project/gazebo/worlds/ruskotunturi_final_sil_demo_v6_world.sdf'
      - 'edge-path-project/gazebo/models/aeb_vehicle_360*/model.sdf'
      - 'tests/rehearse_pitch_gui.sh'

permissions:
  contents: read

jobs:
  live-sil:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Gazebo Harmonic and its Python transport bindings
        run: |
          curl -fsSL --retry 3 https://packages.osrfoundation.org/gazebo.gpg |
            sudo tee /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable noble main' |
            sudo tee /etc/apt/sources.list.d/gazebo-stable.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends gz-harmonic python3-gz-transport13 python3-gz-msgs10 libgl1-mesa-dri can-utils xvfb xauth xdotool scrot python3-tk
      - name: Pan the Gazebo camera and drive both cars through the shared junction
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s '-screen 0 1280x800x24' bash tests/rehearse_pitch_gui.sh pitch-run
        shell: bash
      - name: Drive the scene through the production R2100 programs on virtual CAN
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          mkdir -p pitch-vcan
          if ! sudo modprobe vcan; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe vcan
          fi
          sudo ip link add vcan0 type vcan
          sudo ip link set vcan0 up
          hil=edge-path-project/hil
          children=()
          trap 'kill "${children[@]}" 2>/dev/null || true' EXIT
          for program in r2100_lidar_perception r2100_can_gateway r2100_aeb_controller; do
            /usr/bin/python3 -u "$hil/$program.py" --can-interface vcan0 > "pitch-vcan/$program.log" 2>&1 &
            children+=("$!")
          done
          candump -L vcan0 > pitch-vcan/frames.log &
          children+=("$!")
          /usr/bin/python3 -u edge-path-project/gazebo/scripts/run_pitch_demo.py hil \
            --r2100-host 127.0.0.1 --headless --auto-start --results-dir pitch-vcan 2>&1 | tee pitch-vcan/console.log
          for id in 100 101 200; do grep -Eq "vcan0 +$id#" pitch-vcan/frames.log; done
      - name: Keep the run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gazebo-pitch-rehearsals
          path: |
            pitch-run/
            pitch-vcan/
