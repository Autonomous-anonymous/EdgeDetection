name: Gazebo pitch rehearsal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/gazebo-pitch.yml'
      - 'edge-path-project/gazebo/scripts/*pitch*.py'
      - 'edge-path-project/gazebo/scripts/*sil*v6*.py'
      - 'edge-path-project/gazebo/worlds/ruskotunturi_final_sil_demo_v6_world.sdf'
      - 'edge-path-project/gazebo/models/aeb_vehicle_360*/model.sdf'

permissions:
  contents: read

jobs:
  live-sil:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Gazebo Harmonic and its Python transport bindings
        run: |
          curl -fsSL --retry 3 https://packages.osrfoundation.org/gazebo.gpg |
            sudo tee /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg > /dev/null
          echo 'deb [signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable noble main' |
            sudo tee /etc/apt/sources.list.d/gazebo-stable.list > /dev/null
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends gz-harmonic python3-gz-transport13 python3-gz-msgs10 mesa-utils libgl1-mesa-dri
      - name: Drive the two cars in Gazebo with live cameras and LiDAR
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          mkdir -p pitch-run
          /usr/bin/python3 -u edge-path-project/gazebo/scripts/run_pitch_demo.py sil \
            --headless --auto-start --results-dir pitch-run 2>&1 | tee pitch-run/console.log
        shell: bash
      - name: Keep the run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gazebo-pitch-sil
          path: pitch-run/
